<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    .contenedor {
        display: grid;
        grid-template-columns:1fr 1fr 1fr;
        gap: 1rem;
    }
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    div{
        border:1px solid black
    }
    body{
        font-family:system-ui, sans-serif;
        min-height:100vh;
        background-color: #f5f5f5;
    }
</style>
<body>
<div class="contenedor">
    <div>A</div>
    <div>B</div>
    <div>C</div>
    <div>D</div>
    <div>E</div>
    <div>F</div>
</div>
</body>
</html>
